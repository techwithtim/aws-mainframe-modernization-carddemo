# ============================================================================
# Kubernetes Secret: CardDemo Application Credentials
# ============================================================================
# Purpose: Stores sensitive application credentials including database
#          credentials and JWT signing secrets for the modernized CardDemo
#          credit card management application
#
# Migration Context:
#   Replaces: Legacy RACF security profiles and mainframe credential management
#   From: COBOL application with hardcoded credentials in CSUSR01Y.cpy
#   To: Kubernetes Secret with GitOps-ready Sealed Secret pattern
#
# Security Requirements (PCI-DSS Compliance):
#   - PCI-DSS Requirement 3.4: Encryption at rest (Kubernetes Secret encryption)
#   - PCI-DSS Requirement 8.2: Strong authentication (JWT tokens)
#   - PCI-DSS Requirement 8.5: No shared credentials (unique per environment)
#
# References:
#   - Agent Action Plan Section 0.1.2: Container-First Deployment
#   - Agent Action Plan Section 0.8.1: PCI-DSS Compliance and Security
#   - Technical Specification 6.2.1.1: Database Configuration
#   - Technical Specification 6.4: Security Architecture
# ============================================================================

# ============================================================================
# IMPORTANT SECURITY NOTICE
# ============================================================================
# ⚠️  WARNING: This Secret contains PLACEHOLDER VALUES for demonstration only!
#
# BEFORE PRODUCTION DEPLOYMENT:
# 1. Replace ALL placeholder values with actual production credentials
# 2. Generate strong, unique secrets using secure random generation
# 3. Encrypt this Secret using Sealed Secrets (kubeseal) for GitOps
# 4. Store actual credentials in AWS Secrets Manager as backup
# 5. Enable Kubernetes Secret encryption at rest in EKS cluster
# 6. Rotate credentials regularly (90-day rotation recommended)
#
# NEVER commit unencrypted production secrets to Git repositories!
# ============================================================================

---
# ============================================================================
# Standard Kubernetes Secret (Development/Local Use)
# ============================================================================
# This is the base Secret template for local development and testing.
# For production, convert to SealedSecret (see instructions below).
# ============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: carddemo-db-credentials
  namespace: carddemo
  labels:
    app: carddemo
    component: security
    environment: development
  annotations:
    description: "Database credentials and JWT secrets for CardDemo application"
    migration-source: "app/cpy/CSUSR01Y.cpy (COBOL user security record)"
    sealed-secret: "false"
    rotation-policy: "90-days"

type: Opaque

# ============================================================================
# Secret Data (Base64 Encoded)
# ============================================================================
# All values MUST be base64-encoded per Kubernetes Secret specification.
# 
# To encode a value: echo -n 'your-secret-value' | base64
# To decode a value: echo 'base64-encoded-value' | base64 -d
#
# CURRENT VALUES ARE PLACEHOLDERS - Replace before production use!
# ============================================================================

data:
  # --------------------------------------------------------------------------
  # Database Credentials (PostgreSQL)
  # --------------------------------------------------------------------------
  # Used by: Spring Boot application for PostgreSQL RDS connectivity
  # Referenced in: k8s/deployment.yml (environment variables)
  # Migration from: COBOL ACCTFILE, CARDFILE, CUSTFILE VSAM datasets
  # --------------------------------------------------------------------------
  
  # Database Username (Application User)
  # Placeholder: "carddemo_user" (base64 encoded)
  # Production: Create dedicated PostgreSQL user with minimal privileges:
  #   - CONNECT on carddemo database
  #   - SELECT, INSERT, UPDATE, DELETE on application tables
  #   - USAGE, SELECT on sequences
  #   - NO superuser, NO create database, NO create role
  DB_USER: Y2FyZGRlbW9fdXNlcg==
  
  # Database Password (Application User Password)
  # Placeholder: "changeme-P@ssw0rd-2024!" (base64 encoded)
  # Production Requirements:
  #   - Minimum 16 characters
  #   - Uppercase + lowercase + numbers + special characters
  #   - No dictionary words
  #   - Generated using cryptographically secure random generator
  #   - Example: pwgen -s 32 1 | base64
  DB_PASS: Y2hhbmdlbWUtUEBzc3cwcmQtMjAyNCE=
  
  # --------------------------------------------------------------------------
  # JWT Signing Secret (Spring Security)
  # --------------------------------------------------------------------------
  # Used by: JwtTokenProvider.java for token generation and validation
  # Purpose: Signs JWT tokens to prevent tampering
  # Referenced in: SecurityConfig.java, JwtAuthenticationFilter.java
  # Migration from: COBOL COSGN00C.cbl authentication logic
  # --------------------------------------------------------------------------
  
  # JWT Signing Secret (HS512 Algorithm)
  # Placeholder: "jwt-secret-key-change-me-in-production-minimum-512-bits" (base64)
  # Production Requirements:
  #   - Minimum 512 bits (64 bytes) for HS512 algorithm
  #   - Cryptographically random (not derived from passwords)
  #   - Unique per environment (dev, staging, prod)
  #   - Never shared across applications
  #   - Example: openssl rand -base64 64 | tr -d '\n' | base64
  JWT_SECRET: and0LXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tbWluaW11bS01MTItYml0cw==

  # --------------------------------------------------------------------------
  # Optional: Additional Secrets (Uncomment if needed)
  # --------------------------------------------------------------------------
  
  # Database Encryption Key (for sensitive field encryption)
  # Used for: Encrypting PAN, CVV, SSN in database (PCI-DSS Requirement 3)
  # DB_ENCRYPTION_KEY: <base64-encoded-256-bit-aes-key>
  
  # AWS Secrets Manager ARN (for dynamic secret retrieval)
  # AWS_SECRET_ARN: <base64-encoded-arn>
  
  # API Gateway API Key (if external integrations exist)
  # API_GATEWAY_KEY: <base64-encoded-api-key>

# ============================================================================
# How to Generate Secure Production Secrets
# ============================================================================
# 
# 1. Database Password (32-character random):
#    pwgen -s 32 1 | tr -d '\n' | base64
#
# 2. JWT Secret (64-byte random for HS512):
#    openssl rand -base64 64 | tr -d '\n' | base64
#
# 3. AES Encryption Key (256-bit for AES-256):
#    openssl rand -base64 32 | base64
#
# 4. Full Secret Update Example:
#    kubectl create secret generic carddemo-db-credentials \
#      --namespace=carddemo \
#      --from-literal=DB_USER=carddemo_prod \
#      --from-literal=DB_PASS=$(pwgen -s 32 1) \
#      --from-literal=JWT_SECRET=$(openssl rand -base64 64) \
#      --dry-run=client -o yaml > secret.yml
# ============================================================================

---
# ============================================================================
# Sealed Secret Configuration (Production GitOps Pattern)
# ============================================================================
# For production environments, convert this Secret to a SealedSecret to enable
# secure storage in Git repositories while maintaining GitOps workflows.
#
# SealedSecret is encrypted using cluster-specific public key and can only be
# decrypted by the sealed-secrets controller in the target Kubernetes cluster.
# ============================================================================
#
# Prerequisites:
# 1. Install sealed-secrets controller in EKS cluster:
#    kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/controller.yaml
#
# 2. Install kubeseal CLI:
#    - macOS: brew install kubeseal
#    - Linux: wget https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.24.0/kubeseal-linux-amd64
#
# 3. Verify sealed-secrets controller is running:
#    kubectl get pods -n kube-system -l name=sealed-secrets-controller
#
# ============================================================================
# Conversion to SealedSecret (Step-by-Step)
# ============================================================================
#
# Step 1: Create regular Secret with actual production values (DO NOT commit!)
# kubectl create secret generic carddemo-db-credentials \
#   --namespace=carddemo \
#   --from-literal=DB_USER='<actual-username>' \
#   --from-literal=DB_PASS='<actual-password>' \
#   --from-literal=JWT_SECRET='<actual-jwt-secret>' \
#   --dry-run=client -o yaml > secret-prod.yml
#
# Step 2: Convert to SealedSecret using kubeseal
# kubeseal --format yaml \
#   --cert https://<eks-cluster-endpoint>/v1/cert.pem \
#   < secret-prod.yml > sealed-secret.yml
#
# Step 3: Safely commit sealed-secret.yml to Git
# git add k8s/sealed-secret.yml
# git commit -m "Add encrypted production secrets"
# git push
#
# Step 4: Apply SealedSecret to cluster (GitOps or manual)
# kubectl apply -f k8s/sealed-secret.yml
#
# Step 5: Verify Secret was created by sealed-secrets controller
# kubectl get secret carddemo-db-credentials -n carddemo
# kubectl describe secret carddemo-db-credentials -n carddemo
#
# Step 6: Delete unencrypted secret-prod.yml file
# rm secret-prod.yml
#
# ============================================================================
# Example SealedSecret Output (for reference)
# ============================================================================
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: carddemo-db-credentials
#   namespace: carddemo
# spec:
#   encryptedData:
#     DB_USER: AgBh8... (encrypted with cluster public key)
#     DB_PASS: AgCx9... (encrypted with cluster public key)
#     JWT_SECRET: AgDk2... (encrypted with cluster public key)
#   template:
#     metadata:
#       name: carddemo-db-credentials
#       namespace: carddemo
#     type: Opaque
# ============================================================================

---
# ============================================================================
# Secret Rotation Procedure
# ============================================================================
# Credentials should be rotated regularly per PCI-DSS Requirement 8.2.4
# (change user passwords at least every 90 days).
#
# Rotation Steps:
# 1. Generate new credentials using secure random generation
# 2. Create new Secret with updated values (new version)
# 3. Update database user password in PostgreSQL RDS
# 4. Deploy updated Secret to Kubernetes cluster
# 5. Perform rolling restart of application pods:
#    kubectl rollout restart deployment/carddemo -n carddemo
# 6. Verify application connectivity with new credentials
# 7. Monitor logs for authentication failures
# 8. Archive old credentials securely (for rollback if needed)
# 9. After 24-hour soak period, permanently revoke old credentials
#
# Automated Rotation (AWS Secrets Manager Integration):
# - Configure AWS Secrets Manager with automatic rotation (30/60/90 days)
# - Use external-secrets-operator to sync AWS Secrets to Kubernetes
# - Enable automatic pod restart on secret change
# ============================================================================

---
# ============================================================================
# Integration with Deployment
# ============================================================================
# The Secret is consumed by k8s/deployment.yml via environment variables:
#
# spec:
#   containers:
#   - name: carddemo
#     env:
#     - name: DB_USER
#       valueFrom:
#         secretKeyRef:
#           name: carddemo-db-credentials
#           key: DB_USER
#     - name: DB_PASS
#       valueFrom:
#         secretKeyRef:
#           name: carddemo-db-credentials
#           key: DB_PASS
#     - name: JWT_SECRET
#       valueFrom:
#         secretKeyRef:
#           name: carddemo-db-credentials
#           key: JWT_SECRET
#
# Spring Boot application.yml consumes via ${DB_USER}, ${DB_PASS}, ${JWT_SECRET}
# ============================================================================

---
# ============================================================================
# Security Best Practices Checklist
# ============================================================================
# ✅ Enable Kubernetes Secret encryption at rest in EKS:
#    - AWS EKS encrypts Secrets using AWS KMS by default
#    - Verify: aws eks describe-cluster --name carddemo --query 'cluster.encryptionConfig'
#
# ✅ Use Sealed Secrets for GitOps workflows (production only)
#
# ✅ Restrict Secret access via RBAC:
#    - Create ServiceAccount with minimal permissions
#    - Bind Role allowing 'get' on specific Secret only
#    - Reference ServiceAccount in Deployment
#
# ✅ Enable AWS Secrets Manager integration (recommended):
#    - Store master credentials in AWS Secrets Manager
#    - Use external-secrets-operator for automatic sync
#    - Enable automatic rotation in AWS Secrets Manager
#
# ✅ Monitor Secret access:
#    - Enable Kubernetes audit logging
#    - Alert on unexpected Secret read operations
#    - Review access logs monthly
#
# ✅ Never log Secret values:
#    - Configure logback-spring.xml to mask credentials
#    - Use @ToString.Exclude on password fields in Java
#    - Sanitize error messages that might expose credentials
#
# ✅ Use separate Secrets per environment:
#    - carddemo-db-credentials-dev
#    - carddemo-db-credentials-staging
#    - carddemo-db-credentials-prod
#
# ✅ Document Secret dependencies:
#    - Maintain inventory of all Secrets in use
#    - Track which applications consume each Secret
#    - Include in disaster recovery procedures
# ============================================================================

---
# ============================================================================
# Troubleshooting Secret Issues
# ============================================================================
# Problem: Pods fail to start with "Secret not found" error
# Solution: Verify Secret exists in correct namespace
#   kubectl get secret carddemo-db-credentials -n carddemo
#
# Problem: Application fails to authenticate to database
# Solution: Decode and verify Secret values
#   kubectl get secret carddemo-db-credentials -n carddemo -o jsonpath='{.data.DB_USER}' | base64 -d
#   (Test credentials manually against PostgreSQL RDS)
#
# Problem: JWT token validation fails
# Solution: Verify JWT_SECRET matches between pods
#   kubectl get secret carddemo-db-credentials -n carddemo -o jsonpath='{.data.JWT_SECRET}' | base64 -d | wc -c
#   (Should be minimum 64 characters for HS512)
#
# Problem: Secret changes not reflected in running pods
# Solution: Restart pods to pick up updated Secret
#   kubectl rollout restart deployment/carddemo -n carddemo
#
# Problem: Sealed Secret fails to decrypt
# Solution: Verify sealed-secrets controller is running and namespace/name match
#   kubectl logs -n kube-system -l name=sealed-secrets-controller
# ============================================================================

