---
# Notes for Production Deployment:
#
# 1. ACM Certificate Setup:
#    - Create SSL/TLS certificate in AWS Certificate Manager (ACM)
#    - Validate domain ownership (DNS or email validation)
#    - Copy certificate ARN and set in annotation:
#      alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT:certificate/ID
#
# 2. DNS Configuration:
#    - After Ingress creation, get ALB DNS name:
#      kubectl get ingress carddemo-ingress -n carddemo -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
#    - Create CNAME record: carddemo.example.com → ALB-DNS-NAME
#    - Or use Route 53 Alias record for better performance
#
# 3. Security Groups:
#    - ALB security group automatically created by AWS Load Balancer Controller
#    - Ensure inbound rules allow:
#      * Port 80 (HTTP) from 0.0.0.0/0 (will redirect to HTTPS)
#      * Port 443 (HTTPS) from 0.0.0.0/0
#    - Ensure pod security group allows inbound from ALB security group on port 8080
#
# 4. WAF Integration (optional but recommended for PCI-DSS):
#    - Create AWS WAF Web ACL with managed rule sets:
#      * AWSManagedRulesCommonRuleSet (OWASP Top 10 protection)
#      * AWSManagedRulesKnownBadInputsRuleSet (known malicious patterns)
#      * AWSManagedRulesSQLiRuleSet (SQL injection protection)
#    - Associate Web ACL with ALB via annotation:
#      alb.ingress.kubernetes.io/wafv2-acl-arn: arn:aws:wafv2:REGION:ACCOUNT:regional/webacl/NAME/ID
#
# 5. Rate Limiting (optional for DDoS protection):
#    - Use AWS WAF rate-based rules
#    - Or use annotation: alb.ingress.kubernetes.io/throttle-burst: '100'
#
# 6. Monitoring:
#    - Enable ALB access logs to S3:
#      alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket=my-bucket
#    - Monitor ALB metrics in CloudWatch:
#      * RequestCount, TargetResponseTime, HTTPCode_Target_4XX_Count, HTTPCode_Target_5XX_Count
#    - Set CloudWatch alarms for 5XX errors and high latency
#
# 7. Cost Optimization:
#    - ALB pricing: $0.0225/hour + $0.008/LCU-hour
#    - Consider consolidating multiple Ingress resources into one ALB
#    - Use target-type: ip for better performance (avoids NodePort overhead)
#
# 8. Testing SSL Configuration:
#    - Test HTTPS: curl -v https://carddemo.example.com/actuator/health
#    - Verify HTTP redirect: curl -I http://carddemo.example.com (should return 301/302 to HTTPS)
#    - Check SSL/TLS version: openssl s_client -connect carddemo.example.com:443 -tls1_3
#    - Validate certificate: openssl s_client -showcerts -connect carddemo.example.com:443
#
# 9. Troubleshooting:
#    - Check Ingress status: kubectl describe ingress carddemo-ingress -n carddemo
#    - Check ALB controller logs: kubectl logs -n kube-system deployment/aws-load-balancer-controller
#    - Verify service endpoints: kubectl get endpoints carddemo-service -n carddemo
#    - Test from pod: kubectl run -it --rm debug --image=curlimages/curl --restart=Never -- curl http://carddemo-service/actuator/health
